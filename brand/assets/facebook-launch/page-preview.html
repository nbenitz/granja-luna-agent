<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vista previa — Granja Luna</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #e9edf3;
        color: #17233b;
        font-family: "Noto Sans", Arial, sans-serif;
      }
      .page {
        width: 1000px;
        min-height: 650px;
        margin: 0 auto;
        background: #fff;
      }
      .cover {
        width: 100%;
        height: 370px;
        object-fit: cover;
        display: block;
      }
      .identity {
        min-height: 250px;
        padding: 0 48px 36px 280px;
        position: relative;
      }
      .avatar {
        position: absolute;
        width: 210px;
        height: 210px;
        left: 48px;
        top: -78px;
        border: 7px solid #fff;
        border-radius: 50%;
        object-fit: cover;
        background: #17233b;
      }
      h1 {
        margin: 0;
        padding-top: 28px;
        font-size: 52px;
        line-height: 1.1;
      }
      .handle {
        margin: 8px 0 18px;
        color: #68734a;
        font-size: 22px;
        font-weight: 700;
      }
      p {
        margin: 0;
        max-width: 650px;
        color: #4a5568;
        font-size: 20px;
        line-height: 1.45;
      }
      .status {
        margin-top: 18px;
        display: inline-block;
        padding: 8px 14px;
        border-radius: 999px;
        background: #f8edd4;
        color: #6b4b10;
        font-size: 15px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <img class="cover" src="../../../media/selected/facebook-launch/01d-facebook-cover-grupo-18-pastura-composicion-ia.jpg" alt="Plantel de aves en un sector de pastura de Granja Luna">
      <section class="identity">
        <img class="avatar" src="profile-logo-v1.png" alt="Logo provisional de Granja Luna">
        <h1>Granja Luna</h1>
        <div class="handle">@GranjaLunaPY</div>
        <p>Crianza avícola familiar en Paraguay. Pollitos caseros y Brahma, aprendizaje, selección y vida real en Granja Luna. 🐣</p>
        <span class="status">Portada editorial compuesta · pendiente de aprobación</span>
      </section>
    </main>
  </body>
</html>
