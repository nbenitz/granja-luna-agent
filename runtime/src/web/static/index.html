<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7f3" />
    <title>Granja Luna</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="/static/vendor/lucide.min.js" defer></script>
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"><i data-lucide="moon-star"></i></span>
          <div>
            <strong>Granja Luna</strong>
            <span>Operación diaria</span>
          </div>
        </div>
        <div class="connection" id="connection-status" role="status">
          <span class="connection-dot"></span>
          <span id="connection-label">Conectando</span>
        </div>
      </header>

      <main class="main-content">
        <section class="view is-active" id="view-capture" data-view="capture">
          <div class="view-heading">
            <div>
              <p class="eyebrow" id="today-label"></p>
              <h1>Nueva entrada</h1>
            </div>
            <div class="pending-counter" title="Entradas pendientes">
              <i data-lucide="clock-3"></i>
              <span id="pending-count">0</span>
            </div>
          </div>

          <form class="capture-form" id="capture-form">
            <label for="message">¿Qué pasó en la granja?</label>
            <div class="textarea-wrap">
              <textarea
                id="message"
                name="message"
                rows="8"
                maxlength="12000"
                lang="es"
                enterkeyhint="done"
                placeholder="Contá una compra, tarea, observación o decisión..."
                required
              ></textarea>
              <span class="character-count" id="message-count">0</span>
            </div>

            <details class="context-panel">
              <summary>
                <span><i data-lucide="messages-square"></i> Contexto adicional</span>
                <i class="summary-chevron" data-lucide="chevron-down"></i>
              </summary>
              <label class="sr-only" for="context">Contexto adicional</label>
              <textarea
                id="context"
                name="context"
                rows="3"
                maxlength="12000"
                placeholder="Información de una conversación anterior..."
              ></textarea>
            </details>

            <button class="primary-button" id="capture-submit" type="submit">
              <i data-lucide="send"></i>
              <span>Analizar y guardar</span>
            </button>
          </form>

          <section class="capture-result" id="capture-result" aria-live="polite" hidden></section>
        </section>

        <section class="view" id="view-inbox" data-view="inbox" hidden>
          <div class="view-heading">
            <div>
              <p class="eyebrow">Propuestas</p>
              <h1>Inbox</h1>
            </div>
            <button class="icon-button" id="refresh-inbox" type="button" title="Actualizar inbox">
              <i data-lucide="refresh-cw"></i>
              <span class="sr-only">Actualizar inbox</span>
            </button>
          </div>

          <div class="segmented-control" id="inbox-filters" aria-label="Filtrar inbox">
            <button class="is-selected" type="button" data-status="all">Todas</button>
            <button type="button" data-status="pending">Pendientes</button>
            <button type="button" data-status="needs_information">Falta información</button>
            <button type="button" data-status="needs_correction">A corregir</button>
            <button type="button" data-status="validated">Validadas</button>
          </div>

          <div class="entry-list" id="inbox-list" aria-live="polite"></div>
        </section>

        <section class="view" id="view-activity" data-view="activity" hidden>
          <div class="view-heading">
            <div>
              <p class="eyebrow">Trazabilidad</p>
              <h1>Actividad</h1>
            </div>
            <button class="icon-button" id="refresh-activity" type="button" title="Actualizar actividad">
              <i data-lucide="refresh-cw"></i>
              <span class="sr-only">Actualizar actividad</span>
            </button>
          </div>

          <div class="activity-summary" id="activity-summary"></div>
          <div class="activity-list" id="activity-list" aria-live="polite"></div>
        </section>
      </main>

      <nav class="app-nav" aria-label="Navegación principal">
        <button class="nav-button is-active" type="button" data-target="capture">
          <i data-lucide="square-pen"></i>
          <span>Registrar</span>
        </button>
        <button class="nav-button" type="button" data-target="inbox">
          <span class="nav-icon-wrap">
            <i data-lucide="inbox"></i>
            <span class="nav-badge" id="nav-inbox-badge" hidden></span>
          </span>
          <span>Inbox</span>
        </button>
        <button class="nav-button" type="button" data-target="activity">
          <i data-lucide="activity"></i>
          <span>Actividad</span>
        </button>
      </nav>
    </div>

    <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
    <aside class="entry-sheet" id="entry-sheet" aria-labelledby="sheet-title" aria-modal="true" role="dialog" hidden>
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-header">
        <div>
          <p class="eyebrow">Revisión</p>
          <h2 id="sheet-title">Revisar entrada</h2>
        </div>
        <button class="icon-button" id="close-sheet" type="button" title="Cerrar">
          <i data-lucide="x"></i>
          <span class="sr-only">Cerrar</span>
        </button>
      </div>
      <div class="sheet-content" id="sheet-content"></div>
    </aside>

    <div class="correction-backdrop" id="correction-backdrop" hidden></div>
    <section class="correction-modal" id="correction-modal" aria-labelledby="correction-modal-title" aria-modal="true" role="dialog" hidden>
      <header class="correction-modal-header">
        <div>
          <p class="eyebrow">Corrección</p>
          <h2 id="correction-modal-title"></h2>
        </div>
        <button class="icon-button" id="close-correction-modal" type="button" title="Cerrar edición">
          <i data-lucide="x"></i>
          <span class="sr-only">Cerrar edición</span>
        </button>
      </header>
      <div class="correction-modal-content" id="correction-modal-content"></div>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
